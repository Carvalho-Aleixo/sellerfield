name: gate
on: [push, pull_request]
jobs:
  gate:
    runs-on: ubuntu-latest
    env:
      CI: "true"
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
      - run: bun run fixtures:check
      - run: bun test test/
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker build -t sellerfield .
      - run: |
          docker run -d --name sf -p 8787:8787 sellerfield
          for i in $(seq 1 20); do curl -fs "http://127.0.0.1:8787/api/report?days=7" && break; sleep 1; done
          curl -fs "http://127.0.0.1:8787/api/report?days=7" | grep -q '"demo":true'
