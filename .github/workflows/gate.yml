name: gate
on: [push, pull_request]
jobs:
  gate:
    runs-on: ubuntu-latest
    env:
      CI: "true"
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
      - run: bun run fixtures:check
      - run: bun test test/
      - name: gitleaks
        run: |
          curl -sSL https://github.com/gitleaks/gitleaks/releases/download/v8.30.0/gitleaks_8.30.0_linux_x64.tar.gz | tar -xz gitleaks
          ./gitleaks detect --source . --redact --verbose
  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker build -t sellerfield .
      - run: |
          docker run -d --name sf -p 8787:8787 sellerfield
          for i in $(seq 1 20); do curl -fs "http://127.0.0.1:8787/api/report?days=7" && break; sleep 1; done
          curl -fs "http://127.0.0.1:8787/api/report?days=7" | grep -q '"demo":true'
